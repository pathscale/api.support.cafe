name: CI

on:
  workflow_dispatch:
    inputs:
      visitor_migration_confirmed:
        description: One-time visitor credential cutover guard. The production store has completed --migrate-visitor-credentials, or is new
        type: boolean
        default: false

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  # Deploy when the version changes, not when a file changes.
  #
  # A refactor moves plenty under `src/` and ships nothing anyone asked for.
  # Bumping `version` is an explicit "ship this", so that is the trigger.
  version-check:
    runs-on: ubicloud-standard-2
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: check
        run: |
          OLD=$(git diff HEAD^ HEAD Cargo.toml | sed -n 's/^-version = "\(.*\)"/\1/p')
          NEW=$(git diff HEAD^ HEAD Cargo.toml | sed -n 's/^+version = "\(.*\)"/\1/p')
          if [ -n "$NEW" ]; then
            echo "$OLD -> $NEW"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version unchanged, nothing to deploy"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  fly-deploy:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubicloud-standard-4
    permissions:
      contents: read

    steps:
      # The service refuses to start on a store with chat sessions and no
      # visitor migration marker. The migration needs stopped writers, so it
      # cannot run as part of a rolling deploy.
      - name: Require visitor credential migration
        env:
          CONFIRMED: ${{ inputs.visitor_migration_confirmed }}
        run: |
          if [ "$CONFIRMED" != "true" ]; then
            echo "::error::Run --migrate-visitor-credentials against the production store with writers stopped (docs/visitor-connect.md), then dispatch again with visitor_migration_confirmed."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set version and image
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "FLY_REGISTRY=registry.fly.io" >> $GITHUB_ENV
          echo "FLY_APP=support-cafe-master-fly" >> $GITHUB_ENV

      - name: Cache apt
        uses: ubicloud/cache@92361f338d82d2c58a98875f1b5c95cd14cd6b2a
        with:
          path: |
            /var/cache/apt/archives/
          key: apt-${{ runner.os }}
          restore-keys: apt-

      - name: Install system dependencies
        run: sudo apt-get install -y musl-dev musl-tools

      - name: Fix apt cache permissions
        run: sudo chmod -R 644 /var/cache/apt/archives/* && sudo chown -R $USER /var/cache/apt/archives

      - name: Setup Rust toolchain
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo registry
        uses: ubicloud/cache@92361f338d82d2c58a98875f1b5c95cd14cd6b2a
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: cargo-registry-1-${{ runner.os }}
          restore-keys: cargo-registry-1-

      - name: Setup cargo sweep
        run: |
          set -euo pipefail
          install_root="$(mktemp -d "$RUNNER_TEMP/cargo-sweep.XXXXXX")"
          cargo install --locked --version '=0.8.0' --root "$install_root" cargo-sweep
          CARGO_SWEEP_BIN="$install_root/bin/cargo-sweep"
          test -x "$CARGO_SWEEP_BIN"
          echo "CARGO_SWEEP_BIN=$CARGO_SWEEP_BIN" >> "$GITHUB_ENV"

      - name: Cache target dependencies
        uses: ubicloud/cache@92361f338d82d2c58a98875f1b5c95cd14cd6b2a
        with:
          path: |
            /home/runner/target/release/deps
            /home/runner/target/release/.fingerprint
            /home/runner/target/release/build
            /home/runner/target/x86_64-unknown-linux-musl/release/deps
            /home/runner/target/x86_64-unknown-linux-musl/release/.fingerprint
            /home/runner/target/x86_64-unknown-linux-musl/release/build
          key: nf-target-muls-deps2-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/rust-toolchain.toml') }}
          restore-keys: |
            nf-target-muls-deps2-${{ runner.os }}

      - name: Build musl amd64 binary
        env:
          CARGO_TARGET_DIR: /home/runner/target
          CARGO_INCREMENTAL: "1"
          WS_SERVER_NAME: SupportCafeServer/${{ github.run_number }}-${{ env.VERSION }}
        run: |
          "$CARGO_SWEEP_BIN" sweep --stamp
          cargo build --release --target x86_64-unknown-linux-musl --features s3-sync
          "$CARGO_SWEEP_BIN" sweep --file

      - name: Copy binary into build context
        run: cp /home/runner/target/x86_64-unknown-linux-musl/release/support_cafe ./support_cafe

      - name: Build image with Buildah
        id: build-image
        uses: redhat-actions/buildah-build@9dc2ade9b5db229966b5025ae266311e12f349c4
        with:
          image: ${{ env.FLY_REGISTRY }}/${{ env.FLY_APP }}
          tags: ${{ env.VERSION }} latest
          base-image: scratch
          content: ./support_cafe
          entrypoint: /support_cafe

      - name: Login to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: printf '%s' "$FLY_API_TOKEN" | buildah login -u x --password-stdin "${{ env.FLY_REGISTRY }}"

      - name: Push image to Fly registry
        run: |
          buildah push --compression-format gzip --remove-signatures ${{ env.FLY_REGISTRY }}/${{ env.FLY_APP }}:${{ env.VERSION }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly
        run: flyctl deploy --config fly.toml --detach --ha=false --image ${{ env.FLY_REGISTRY }}/${{ env.FLY_APP }}:${{ env.VERSION }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
