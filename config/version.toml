# Constraints checked by endpoint-gen at startup (see check_compatibility).
#
# binary: a semver requirement on the endpoint-gen binary itself. "1.10.1" is
#   a caret range, so any 1.x >= 1.10.1 satisfies it.
# libs:   the concrete endpoint-libs version this repo builds against. It must
#   satisfy the requirement the binary was compiled with (endpoint-gen 1.10.1+
#   requires ^2.0). Keep it in sync with Cargo.lock.

[binary]
version = "1.10.1"

[libs]
version = "2.0.0"
