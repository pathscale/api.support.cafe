[workspace]
members = [".", "migration"]

[package]
name = "support_cafe"
version = "0.1.7"
edition = "2024"

[[bin]]
name = "worktable_rebuild"
path = "src/bin/worktable_rebuild.rs"
required-features = ["s3-sync"]

[dependencies]
async-trait = "^0.1"
chrono = { version = "^0.4", default-features = false, features = ["oldtime", "std", "now"] }
clap = { version = "^4.5", features = ["derive"] }
config = { version = "^0.15", default-features = false, features = ["toml"] }
crossfire = "^3.1.20"
derive_more = { version = "^2.1.1", features = ["full"] }
endpoint-libs = { version = "^3.3", features = ["ws", "ws-http1"] }
eyre = "^0.6"
futures = "^0.3"
num-derive = "^0.5"
num-traits = "^0.2"
parking_lot = "^0.12"
psc-nanoid = { version = "^3.2", features = ["serde", "packed", "rkyv"] }
rkyv = "^0.8.12"
secrecy = "^0.10.3"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
smart-default = "^0.7"
strum = "^0.28"
strum_macros = "^0.28"
nagoya = { version = "^0.1.12", features = ["reactor"] }
nago-rustls = "^0.1.1"
tracing = "^0.1"
url = "^2.5.7"
worktable = { version = "^1.10.0-beta2" }
honey_id-types = "^2.2"

[features]
s3-sync = ["worktable/s3-support"]
