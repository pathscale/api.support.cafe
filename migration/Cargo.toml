[package]
name = "support_cafe_migrate"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "support_cafe_migrate"
path = "src/main.rs"

[dependencies]
support_cafe = { path = "..", features = ["s3-sync"] }
worktable = { version = "0.9.1" }
rkyv = "0.8.12"
eyre = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0", features = ["derive"] }
smart-default = "0.7"
derive_more = { version = "2.1", features = ["full"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.15"
rustls = { version = "0.23.39", default-features = false, features = ["ring", "std"] }
futures = "0.3"
uuid = { version = "1.18", features = ["v4", "serde"] }
