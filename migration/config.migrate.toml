# Usage: cargo run -p support_cafe_migrate -- --config migration/config.migrate.toml
# Env override prefix: SUPPORT_CAFE_MIGRATE__. Pass the keys that way, never here:
#   SUPPORT_CAFE_MIGRATE__S3__ACCESS_KEY, SUPPORT_CAFE_MIGRATE__S3__SECRET_KEY

[s3]
bucket_name = "support-cafe-master-tigris"
endpoint = "https://t3.storage.dev"
access_key = ""
secret_key = ""
prefix = "db"

[migration]
output_path = "./data/new"
